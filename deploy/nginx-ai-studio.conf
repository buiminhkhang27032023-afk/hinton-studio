# Include INSIDE the EXISTING HTTPS server {} for the chosen domain.
# Keep the current website's root/location / unchanged.
location = /ai_studio {
    return 302 /ai_studio/;
}

location ^~ /ai_studio/ {
    auth_basic "Hinton Studio";
    auth_basic_user_file /etc/nginx/.htpasswd-hinton-studio;
    client_max_body_size 150m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No trailing slash: preserve /ai_studio for Next.js basePath.
    proxy_pass http://127.0.0.1:3210;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
}
